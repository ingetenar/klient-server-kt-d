<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulgpalliklubi</title>
</head>
<body>
    <header>
        <h1>Sulgpalliklubi</h1>

        <nav>
            <a href="#mangukorrad">Mängukorrad</a>
            <a href="#otsing">Otsing</a>
        </nav>
    </header>

    <main>
        <section id="mangukorrad">
            <h2>Mängukorrad</h2>

            <table>
                <thead>
                    <tr>
                        <th>Kuupäev</th>
                        <th>Algus</th>
                        <th>Väljakute arv</th>
                        <th>Vabade kohtade arv</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>10.09.2026</td>
                        <td>18:00</td>
                        <td>4</td>
                        <td>8</td>
                    </tr>
                    <tr>
                        <td>12.09.2026</td>
                        <td>17:00</td>
                        <td>3</td>
                        <td>4</td>
                    </tr>
                    <tr>
                        <td>15.09.2026</td>
                        <td>19:00</td>
                        <td>5</td>
                        <td>12</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section id="otsing">
            <h2>Mängukordade otsing</h2>

            <form action="index.html" method="get">
                <fieldset>
                    <legend>Otsingu tingimused</legend>

                    <p>
                        <label for="alates">Alates kuupäevast:</label>
                        <input type="date" id="alates" name="alates">
                    </p>

                    <p>
                        <label for="vabu">Vabu kohti vähemalt:</label>
                        <input type="number" id="vabu" name="vabu" min="1" max="24">
                    </p>

                    <p>
                        <label for="sort">Sorteerimine:</label>
                        <select id="sort" name="sort">
                            <option value="kuupaev">Kuupäeva järgi</option>
                            <option value="algus">Algusaja järgi</option>
                            <option value="vabad">Vabade kohtade järgi</option>
                        </select>
                    </p>

                    <p>
                        <input type="checkbox" id="ainultVabad" name="ainultVabad" value="1">
                        <label for="ainultVabad">
                            Näita ainult vabade kohtadega mängukordi
                        </label>
                    </p>

                    <p>
                        <label for="epost">E-post:</label>
                        <input type="email" id="epost" name="epost">
                    </p>

                    <button type="submit">Otsi</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sulgpalliklubi</p>
    </footer>
</body>
</html>
